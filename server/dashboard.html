<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MKYBOOT Dashboard</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:20px;background:#f5f5f5;color:#222}
h1{margin:0 0 10px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid #888;background:#eee;border-radius:4px;cursor:pointer}
pre{background:#111;color:#0f0;padding:10px;border-radius:4px;overflow:auto;max-height:300px}
</style>
</head>
<body>
<h1>MKYBOOT Server Dashboard</h1>
<div class="card" id="loginCard">
<b>Admin Token:</b> <input id="token" type="password" style="width:300px"> <button class="btn" onclick="login()">Login</button>
<span id="loginStatus"></span>
</div>
<div class="card"><b>Health:</b> <span id="health">loading...</span></div>
<div class="card"><b>Clients:</b><pre id="clients">loading...</pre></div>
<div class="card"><b>Storage Health:</b><pre id="storage">loading...</pre></div>
<div class="row">
<button class="btn" onclick="refresh()">Refresh</button>
</div>
<script>
function getToken(){return sessionStorage.getItem('mkyboot_token')||'';}
async function api(p){
  const t=getToken();
  const opts=t?{headers:{'Authorization':'Bearer '+t}}:{};
  try{const r=await fetch(p,opts);return await r.json();}catch(e){return {error:String(e)};}
}
function login(){
  const v=document.getElementById('token').value;
  sessionStorage.setItem('mkyboot_token',v);
  document.getElementById('loginStatus').textContent='saved';
  refresh();
}
async function refresh(){
  const h=await api('/healthz'); document.getElementById('health').textContent=JSON.stringify(h);
  const c=await api('/api/clients'); document.getElementById('clients').textContent=JSON.stringify(c,null,2);
  const s=await api('/api/storage/health'); document.getElementById('storage').textContent=JSON.stringify(s,null,2);
}
refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
